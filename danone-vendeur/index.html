<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4ea2">
  <meta name="description" content="قائمة المهام اليومية للبائع بالترتيب مع التذكيرات والحسابات.">
  <title>يوم البائع</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div>
        <h1>يوم البائع</h1>
        <p class="sub" id="who">—</p>
      </div>
      <div class="date" id="today">—</div>
    </div>
    <div class="progress" aria-label="نسبة الإنجاز">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <p class="progress-label" id="progressLabel">0%</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="day" role="tab">مهام اليوم</button>
    <button class="tab" data-view="history" role="tab">السجل</button>
    <button class="tab" data-view="settings" role="tab">الإعدادات</button>
  </nav>

  <div id="banner" class="banner hidden" role="alert"></div>

  <main id="view"></main>

  <script src="app.js"></script>
</body>
</html>
